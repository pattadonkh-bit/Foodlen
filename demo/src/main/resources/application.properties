spring.application.name=foodlen
server.port=${PORT:8080}

# ฐานข้อมูล (H2 แบบไฟล์ เก็บที่ ./data/) สลับเป็น PostgreSQL ได้โดยเปลี่ยน datasource และ dependency
spring.datasource.url=jdbc:h2:file:./data/foodlen
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ฐานข้อมูล Postgres บน Neon: Neon หยุดพักเมื่อไม่มีคนใช้ จึงไม่เก็บ connection ว่างไว้นานและจำกัดจำนวนให้น้อย (แพ็กเกจฟรีมีขีดจำกัดจำนวน connection)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# บริการ AI (โฟลเดอร์ yolo-service) และเกณฑ์ความมั่นใจ
# ถ้าความมั่นใจของเมนูอันดับ 1 ต่ำกว่าเกณฑ์ ระบบจะให้ผู้ใช้ยืนยันเมนูก่อน (ผลทดลองที่ 2: ResNet50 ที่ 0.8 รับอัตโนมัติ 74%)
foodlen.ai-service-url=http://127.0.0.1:5000
foodlen.confidence-threshold=0.80

# ใช้คุกกี้เท่านั้น ไม่ต่อ ;jsessionid ท้าย URL (ไม่งั้นลิงก์ redirect จะข้ามคอนโทรลเลอร์หน้าแรก)
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.same-site=lax

# บัญชีครู/นักโภชนาการ (สร้างอัตโนมัติถ้ายังไม่มี) ตั้งผ่านตัวแปรสภาพแวดล้อม อย่าเขียนรหัสผ่านลงไฟล์นี้
#   FOODLEN_BOOTSTRAP_STAFF_USERNAME / FOODLEN_BOOTSTRAP_STAFF_PASSWORD / FOODLEN_BOOTSTRAP_STAFF_DISPLAY_NAME
# บัญชีสาธิต (teacher, parent1, parent2) สร้างเมื่อเปิด foodlen.seed-demo=true เท่านั้น ดู README
