<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('เข้าสู่ระบบ')}"></head>
<body>
<header th:replace="~{fragments :: nav('login')}"></header>
<main class="container narrow">
    <div class="auth">
        <div class="eyebrow" th:text="${brand}">NutriKid</div>
        <h1>เข้าสู่ระบบ</h1>
        <p class="subtitle">ระบบเฝ้าระวังภาวะโภชนาการเด็กวัยเรียน 6–12 ปี จากภาพอาหารไทย</p>

        <div class="msg error" th:if="${loginError}">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
        <div class="msg ok" th:if="${loggedOut}">ออกจากระบบแล้ว</div>
        <div class="msg ok" th:if="${registered}">สมัครสมาชิกเรียบร้อย เข้าสู่ระบบได้เลย</div>

        <form class="card" th:action="@{/login}" method="post">
            <label for="username">อีเมล</label>
            <input type="text" id="username" name="username" maxlength="50" required autofocus
                   autocomplete="username" autocapitalize="none" spellcheck="false">

            <label for="password">รหัสผ่าน</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <button class="btn block" type="submit" style="margin-top:20px">เข้าสู่ระบบ</button>
            <p class="muted" style="margin:14px 0 0;text-align:center">
                ผู้ปกครองยังไม่มีบัญชี? <a th:href="@{/register}">สมัครสมาชิก</a>
            </p>
        </form>
        <p class="muted" style="text-align:center">
            บัญชีครู/นักโภชนาการสร้างโดยผู้ดูแลระบบ · ข้อมูลสุขภาพเด็กเห็นได้เฉพาะผู้ที่มีสิทธิ์
        </p>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
