<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('สมัครสมาชิก')}"></head>
<body>
<header th:replace="~{fragments :: nav('register')}"></header>
<main class="container narrow">
    <div class="auth">
        <div class="eyebrow">FOODLEN</div>
        <h1>สมัครสมาชิกผู้ปกครอง</h1>
        <p class="subtitle">สร้างบัญชีเพื่อบันทึกและดูข้อมูลของลูก ผู้ปกครองจะเห็นเฉพาะเด็กที่ตัวเองลงทะเบียน</p>

        <div class="msg error" th:if="${error}" th:text="${error}"></div>

        <form class="card" th:action="@{/register}" method="post">
            <label for="email">อีเมล <span class="muted" style="font-weight:400">(ใช้เป็นชื่อสำหรับเข้าสู่ระบบ)</span></label>
            <input type="email" id="email" name="email" maxlength="100" required autocomplete="email"
                   autocapitalize="none" spellcheck="false" placeholder="name@example.com" th:value="${email}">

            <label for="displayName">ชื่อที่แสดง</label>
            <input type="text" id="displayName" name="displayName" maxlength="100" required th:value="${displayName}">

            <label for="password">รหัสผ่าน <span class="muted" style="font-weight:400">(อย่างน้อย 8 ตัวอักษร)</span></label>
            <input type="password" id="password" name="password" minlength="8" maxlength="72" required autocomplete="new-password">

            <label for="confirm">ยืนยันรหัสผ่าน</label>
            <input type="password" id="confirm" name="confirm" minlength="8" maxlength="72" required autocomplete="new-password">

            <button class="btn block" type="submit" style="margin-top:20px">สมัครสมาชิก</button>
            <p class="muted" style="margin:14px 0 0;text-align:center">
                มีบัญชีแล้ว? <a th:href="@{/login}">เข้าสู่ระบบ</a>
            </p>
        </form>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
